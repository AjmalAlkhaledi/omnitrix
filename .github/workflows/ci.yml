name: CI

on:
  push:
    branches: [main, '*.x', 'x.*']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: redis, pdo_mysql, mbstring
          tools: composer:v2
          coverage: none

      - name: Build OpenSwoole 26.2 (TLS, HTTP/2, curl hook)
        run: |
          # setup-php's PECL install picks another version or none on new PHP releases.
          sudo apt-get install -y --no-install-recommends libssl-dev libcurl4-openssl-dev
          curl -sSfL https://pecl.php.net/get/openswoole-26.2.0.tgz | tar xz
          cd openswoole-26.2.0
          phpize
          ./configure --enable-openssl --enable-http2 --enable-hook-curl
          make -j"$(nproc)"
          sudo make install
          echo "extension=openswoole" | sudo tee "$(php -r 'echo PHP_CONFIG_FILE_SCAN_DIR;')/60-openswoole.ini"
          php --ri openswoole | grep -iE 'version|http2|openssl|curl'
          cd .. && rm -rf openswoole-26.2.0

      - run: composer validate --strict

      - name: Use the core development branch (unreleased x.* work)
        if: startsWith(github.head_ref || github.ref_name, 'x.')
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # The x.* template targets an unreleased core version; test it against core's branch.
          composer config repositories.core vcs https://github.com/AjmalAlkhaledi/omnitrix-core
          composer require --no-update "omnitrix/core:dev-${BRANCH} as 0.2.0"

      - run: composer install --no-interaction --no-progress
      - run: cp .env.example .env
      - name: Tests
        run: vendor/bin/omnitrix-phpunit
